[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-claims-agent"
version = "0.1.0"
description = "Non-authoritative natural-language explanation agent for claim adjudication decisions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Test tooling — install with: pip install -e "claims-agent[dev]"
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
