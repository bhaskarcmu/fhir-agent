[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-prediction-lab"
version = "0.1.0"
description = "Phase 8 experimentation workbench: research rounds for outcome prediction (docs/phase8/experimentation-protocol.md)"
requires-python = ">=3.11"
dependencies = [
    "outcome-prediction-service",   # pip install -e outcome-prediction-service — one implementation, not a fork (O29)
    "shap==0.54.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Local run tracking + UI (O30). Optional: heavy, and a round's committed metrics.json is the record.
tracking = ["mlflow==3.17.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
