# Local demo stack: HAPI FHIR + triage service + MCP agent
#
# Usage:
#   cp .env.example .env          # set ANTHROPIC_API_KEY
#   docker compose up --build -d fhir triage
#   python3 data/scripts/seed_demo.py
#   docker compose run --rm mcp-agent \
#     python3 -m agent.agent --query "Check refill risk for Kristle Mraz"

services:

  # ── HAPI FHIR JPA server (R4) ─────────────────────────────────────────────
  fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: fhir-agent-fhir
    ports:
      - "8080:8080"
    volumes:
      - ./docker/healthcheck/HttpHealthcheck.java:/opt/healthcheck/HttpHealthcheck.java:ro
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.expunge_enabled: "true"
      spring.datasource.url: jdbc:h2:mem:hapi
    # HAPI has Java but no shell/curl, so run a source-file Java HTTP probe.
    healthcheck:
      test: ["CMD", "java", "/opt/healthcheck/HttpHealthcheck.java", "http://localhost:8080/fhir/metadata"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ── Triage service ────────────────────────────────────────────────────────
  # Clinical-hat consumer. Defaults to talking directly to the fhir container for
  # the local demo; set FHIR_GATEWAY_URL to the Kong proxy for the gated setup.
  triage:
    build:
      context: .
      dockerfile: triage-service/Dockerfile
    container_name: fhir-agent-triage
    ports:
      - "8001:8001"
    environment:
      # Default: direct to the fhir container (local demo, no Kong).
      # Override with the Kong proxy URL for the gated setup, e.g. http://localhost:8000/fhir
      FHIR_GATEWAY_URL: ${FHIR_GATEWAY_URL:-http://fhir:8080/fhir}
      FHIR_API_KEY: ${FHIR_API_KEY:-}            # Kong API key — omit for local dev
      # Observability profile only (docs/phase6): safe to leave set even when
      # jaeger isn't running -- the OTLP exporter fails closed in the
      # background, it never blocks or fails a real request.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
    depends_on:
      fhir:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MCP agent (run-once CLI) ──────────────────────────────────────────────
  # Clinical-hat consumer. Defaults to talking directly to the fhir container for
  # the local demo; set FHIR_GATEWAY_URL to the Kong proxy for the gated setup.
  mcp-agent:
    build:
      context: .
      dockerfile: mcp-agent/Dockerfile
    container_name: fhir-agent-mcp
    environment:
      # ANTHROPIC_API_KEY is preferred; CLAUDE_API_KEY (the Ona secret name) is
      # accepted as a fallback by the agent.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      # Default: direct to the fhir container (local demo, no Kong).
      FHIR_GATEWAY_URL: ${FHIR_GATEWAY_URL:-http://fhir:8080/fhir}
      FHIR_API_KEY: ${FHIR_API_KEY:-}            # Kong API key — omit for local dev
      TRIAGE_SERVICE_URL: http://triage:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
    depends_on:
      triage:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ══ Phase 2 (opt-in: `docker compose --profile phase2 up`) ═════════════════
  # Additive only — none of the below start on a plain `docker compose up`.

  # ── Legacy RxClaim / IBM i emulator (INTERNAL ONLY — no host port) ─────────
  rxclaim-emulator:
    build:
      context: ./rxclaim-emulator
    container_name: fhir-agent-rxclaim
    profiles: ["phase2"]
    # No published port: reachable only at rxclaim-emulator:8091 on the compose network,
    # mirroring the cloud "ingress=internal" posture. Consumers go through claims-service.
    command:
      - "--management.otlp.tracing.endpoint=http://jaeger:4317"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8091"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # ── Claims adjudication façade (edge-facing) ──────────────────────────────
  claims-service:
    build:
      context: ./claims-service
    container_name: fhir-agent-claims
    profiles: ["phase2"]
    ports:
      - "8090:8090"
    volumes:
      - ./data/payer-kb:/app/payer-kb:ro   # curated payer KB (C3 seam), read-only
    # Spring program args (highest precedence) wire the downstream services on the network.
    command:
      - "--payer-kb.dir=/app/payer-kb"
      - "--rxclaim.base-url=http://rxclaim-emulator:8091"
      - "--triage.base-url=http://triage:8001"
      - "--fhir.base-url=http://fhir:8080/fhir"
      - "--management.otlp.tracing.endpoint=http://jaeger:4317"
    depends_on:
      fhir:
        condition: service_healthy
      triage:
        condition: service_healthy
      rxclaim-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8090"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # ── Claims explanation agent (run-once CLI) ───────────────────────────────
  claims-agent:
    build:
      context: ./claims-agent
    container_name: fhir-agent-claims-agent
    profiles: ["phase2"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}     # falls back to deterministic explanation if unset
      CLAIMS_GATEWAY_URL: http://claims-service:8090
      CLAIMS_API_KEY: ${CLAIMS_API_KEY:-}     # Kong key for the gated setup; omit for direct
    depends_on:
      claims-service:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ══ Gateway (opt-in: `docker compose --profile phase2 --profile gateway up`) ═
  # DB-less Kong edge gateway (decision C2). Fronts /claims, /fhir, /triage with key-auth.
  # A dev apikey is GENERATED at startup and printed to the logs (never committed):
  #   docker compose logs kong | grep 'DEV APIKEY'
  # Then call the gated edge, e.g.:  curl -H "apikey: <key>" http://localhost:8000/fhir/metadata
  kong:
    image: kong:3.7
    container_name: fhir-agent-kong
    profiles: ["gateway"]
    ports:
      - "8000:8000"          # proxy (matches the cloud port-forward convention)
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./gateway/kong/kong.tmpl.yml:/kong/kong.tmpl.yml:ro
    # Generate a key, render the declarative config, print the key, then start Kong.
    # ($$ escapes $ for the container shell; compose would otherwise interpolate it.)
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        KEY=$$(cat /proc/sys/kernel/random/uuid | tr -d '-')
        sed "s/__DEV_KEY__/$$KEY/" /kong/kong.tmpl.yml > /tmp/kong.yml
        echo "[kong] DEV APIKEY: $$KEY"
        exec /docker-entrypoint.sh kong docker-start
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  # ══ Phase 3 (opt-in: `docker compose --profile phase3 up`) ═════════════════
  # Additive only — none of the below start on a plain `docker compose up`.

  # ── Provider registry Postgres (dev/test only — see provider-registry-service/README) ──
  postgres:
    image: postgres:16-alpine
    container_name: fhir-agent-postgres
    profiles: ["phase3"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: provider_registry
      POSTGRES_PASSWORD: provider_registry
      POSTGRES_DB: provider_registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provider_registry"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Provider registry service (INTERNAL ONLY — no host port) ──────────────
  # Never on the Kong edge (design.md §9) — reachable only at provider-registry:8002
  # on the compose network, mirroring the cloud "ingress=internal" posture (same
  # pattern as rxclaim-emulator above).
  provider-registry:
    build:
      context: .
      dockerfile: provider-registry-service/Dockerfile
    container_name: fhir-agent-provider-registry
    profiles: ["phase3"]
    environment:
      DATABASE_URL: postgresql://provider_registry:provider_registry@postgres:5432/provider_registry
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Provider curation agent (run-once CLI) ─────────────────────────────────
  # Orchestrates data/scripts/provider_ingest/ and narrates the result (design.md §3.2).
  # NOT an MCP client -- ingestion is out of the MCP boundary. No cloud-readiness stub:
  # a CLI tool has no deployable surface (same as claims-agent).
  provider-curation-agent:
    build:
      context: .
      dockerfile: provider-curation-agent/Dockerfile
    container_name: fhir-agent-provider-curation-agent
    profiles: ["phase3"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}     # falls back to deterministic summary if unset
      DATABASE_URL: postgresql://provider_registry:provider_registry@postgres:5432/provider_registry
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ══ Observability (opt-in: `docker compose --profile observability up`) ═══
  # Local dev-loop target for Phase 6 M2 (docs/phase6/decisions.md H16/H22).
  # OTLP traces -> Jaeger; Micrometer/Prometheus metrics -> Prometheus;
  # Grafana pre-provisioned with both as datasources. Same OTLP-exporting
  # code in every instrumented service repoints at Cloud Trace/Managed
  # Prometheus later purely via OTEL_EXPORTER_OTLP_ENDPOINT -- no code change.

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: fhir-agent-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fhir-agent-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fhir-agent-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"    # local dev only -- no login prompt
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger

  # ── Provider search agent (run-once CLI) ───────────────────────────────────
  # Real MCP client/host (design.md §3.1, §8.2) -- spawns provider-mcp-server as a local
  # child process over stdio; that server calls provider-registry over HTTP in turn.
  # ANTHROPIC_API_KEY/CLAUDE_API_KEY is REQUIRED (decisions.md P18) -- unlike
  # claims-agent/provider-curation-agent, this agent has no deterministic fallback since
  # its whole job is natural-language decomposition.
  provider-search-agent:
    build:
      context: .
      dockerfile: provider-search-agent/Dockerfile
    container_name: fhir-agent-provider-search-agent
    profiles: ["phase3"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      PROVIDER_REGISTRY_URL: http://provider-registry:8002
    depends_on:
      provider-registry:
        condition: service_healthy
    stdin_open: true
    tty: true
