server:
  port: 8092   # next available port after claims-service (8090) and rxclaim-emulator (8091)

spring:
  application:
    name: epic-emulator

fhir:
  # Root of fhir-service — NOT including /fhir. The incoming request's own path (e.g.
  # /fhir/Patient) is forwarded verbatim, so pointing a consumer's FHIR base URL at
  # http://localhost:8092/fhir just works with no path rewriting (PRD UC1).
  base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

epic:
  auth:
    # This token endpoint's own URL — must match the aud claim clients put in their JWT
    # client assertion. Update if you change server.port.
    token-endpoint: http://localhost:8092/oauth2/token
    token-ttl-seconds: 300
    # Dev-simple client registration (design.md §4/§14, decision E8): add an entry per
    # registered test client — no approval workflow, just config. Generate an RSA key pair,
    # keep the private key to yourself, and register only the public JWK here:
    #   clients:
    #     - client-id: my-test-client
    #       jwk: '{"kty":"RSA","n":"...","e":"AQAB","kid":"my-test-client"}'
    clients: []
