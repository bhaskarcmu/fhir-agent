server:
  port: 8090   # edge-facing façade (fronted by Kong at /claims)

spring:
  application:
    name: claims-service

# Payer knowledge base (curated fixtures; C3 repository seam). Default resolves to the repo's
# data/payer-kb when run from the claims-service module directory.
payer-kb:
  dir: ../data/payer-kb

# Downstream services. Internal-only legacy core + reused triage.
rxclaim:
  base-url: http://localhost:8091
triage:
  base-url: http://localhost:8001

# Platform FHIR server (HAPI) — persists the decision artefact graph.
fhir:
  base-url: http://localhost:8080/fhir

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Observability (docs/phase6/decisions.md H16 -- closes Phase 2's R15):
  # tracing + Prometheus metrics side by side, same split as fhir-service's
  # existing Micrometer setup. Sample everything locally; a real sampling
  # policy is cloud-deploy follow-up work, not this milestone's job.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
