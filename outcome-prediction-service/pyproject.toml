[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-prediction-service"
version = "0.1.0"
description = "Phase 8: ML patient-outcome prediction (12-month hospitalization risk) trained on AHRQ MEPS"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    # Pinned exactly: pickled models aren't portable across scikit-learn versions, and the
    # reproduction tolerances assume this version (docs/phase8/decisions.md O12).
    "scikit-learn==1.9.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# The scoring API (M7). Also needs client/clinical (pip install -e client/clinical — not on PyPI).
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",            # the demo seeder (etl/synthea.py seed)
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-urllib>=0.48b0",
]
# Only needed to push to / read from gs:// private mirrors (meps.mirror).
gcs = ["google-cloud-storage>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Data the code reads at run time: MEPS aggregates (M6/M7), the diagnosis code lists and SNOMED map (M13).
[tool.setuptools.package-data]
outcome_prediction = ["etl/*.json", "etl/codelists/*.json", "etl/codelists/maps/*.json"]
