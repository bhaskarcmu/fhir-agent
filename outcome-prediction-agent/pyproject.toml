[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-prediction-agent"
version = "0.1.0"
description = "Phase 8: conversational access to the 12-month hospitalization risk service"
requires-python = ">=3.11"
dependencies = [
    "agent-platform",        # installed via pip install -e agent-platform (Phase 6)
    "anthropic>=0.28",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
outcome-prediction-agent = "outcome_prediction_agent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
outcome_prediction_agent = ["policy.md"]
