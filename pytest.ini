[pytest]
# importlib import mode: the per-package `tests/` packages share the name
# "tests" and collide under the default import mode when collected together.
addopts = --import-mode=importlib

# Only the real pytest suites. This deliberately excludes the script-style
# client/clinical/smoke_test.py and client/platform/integration_test.py, which
# are meant to be run directly (they need a live server and call sys.exit).
testpaths =
    client/clinical/tests
    triage-service/src/triage/tests
    mcp-agent/tests
    claims-agent/tests
    provider-registry-service/src/provider_registry/tests
    provider-curation-agent/tests
    provider-mcp-server/tests
    provider-search-agent/tests
    outcome-prediction-service/src/outcome_prediction/tests
    outcome-prediction-lab/src/outcome_prediction_lab/tests
    data/scripts
