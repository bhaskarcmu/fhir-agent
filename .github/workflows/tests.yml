name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ── The LLM provider env var must never be pinned to a paid/third-party value in
  #    CI config (docs/phase6/decisions.md H50) -- CI is unattended/automated; only a
  #    human's deliberate, in-the-moment choice may select a paid provider (H46).
  #    Checked here, not just left to code review, per the user's explicit "harder
  #    gate" call. NOTE: the pattern below is built from two half-strings at run time
  #    so this step's own source line never literally spells out what it's looking
  #    for -- otherwise this check would trip on itself. ──────────────────────────
  ci-config-llm-provider-gate:
    name: ci config (no paid LLM provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the LLM provider var is pinned to a paid provider anywhere in CI config
        run: |
          var_name="LLM""_PROVIDER"
          pattern="${var_name}[=:] *[\"']?(anthropic|openai_compatible)"
          hits=$(grep -rEn "$pattern" .github/workflows .ona 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::The LLM provider env var was found pinned to a paid/third-party value in CI config above. CI must never spend money automatically (docs/phase6/decisions.md H50) -- only a human's deliberate choice may select a paid provider (H46). Remove it; CI should always use the free, self-hosted ollama default."
            exit 1
          fi
          echo "OK -- no paid LLM provider pin found in CI config."

  # ── Phase 1 independence (R9): Phase 1 suites pass with NO Phase 2 packages installed,
  #    and a plain `docker compose up` still resolves to exactly the Phase 1 services. ──
  phase1:
    name: phase1 (independence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Ollama is now a required test dependency (docs/phase6/decisions.md H45, H50):
      # mcp-agent's default provider is self-hosted Llama, and the live adversarial
      # tests hard-fail (not self-skip) without it. Cache ~/.ollama/models across runs
      # so a warm cache doesn't re-download every run (the model is ~1.3GB).
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.2-1b-v1
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done
      - name: Pull the test model (cache hit makes this a fast no-op)
        run: ollama pull llama3.2:1b
      - name: Install Phase 1 packages only
        run: |
          python -m pip install --upgrade pip
          pip install -e "client/clinical[dev]" -e "agent-platform[dev]" -e "triage-service[dev]" -e "mcp-agent[dev]"
      - name: Run Phase 1 test suites (no Phase 2 present)
        run: |
          pytest client/clinical/tests \
                 triage-service/src/triage/tests \
                 mcp-agent/tests -q
      - name: Run agent-platform's own test suite
        # Deliberately a separate pytest invocation, not combined into the
        # command above: agent-platform/tests isn't in the root pytest.ini's
        # testpaths (that file's own --import-mode=importlib comment explains
        # why -- same-named tests/conftest.py packages collide when collected
        # in one process together). agent-platform has its own pyproject.toml
        # pytest config, so this runs it standalone the same way a developer
        # would locally.
        run: pytest agent-platform/tests -q
      - name: Default compose stack is unchanged (additive-only guarantee)
        run: |
          got=$(docker compose config --services | sort | paste -sd' ' -)
          echo "default services: $got"
          test "$got" = "fhir mcp-agent triage"

  # ── Phase 2 Java services ──────────────────────────────────────────────────
  phase2-java:
    name: phase2 (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test rxclaim-emulator
        run: mvn -B -f rxclaim-emulator/pom.xml test
      - name: Test claims-service
        run: mvn -B -f claims-service/pom.xml test

  # ── Phase 2 explanation agent ──────────────────────────────────────────────
  phase2-python:
    name: phase2 (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test claims-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e "claims-agent[dev]"
          pytest claims-agent/tests -q

  # ── Phase 3 Python services/agents ──────────────────────────────────────────
  # A real Postgres service container so the DB-backed tests actually run here, not just
  # self-skip -- this is the executed cloud/DB smoke test M7 named as its own deliverable
  # (design.md §13), not left as a manual-only check. The groundedness eval
  # (provider-search-agent/tests/test_groundedness_eval.py) self-skips in CI: it makes
  # real, billed Claude API calls, and no ANTHROPIC_API_KEY/CLAUDE_API_KEY secret is
  # configured here -- a deliberate cost-conscious choice, not an oversight (design.md §13).
  phase3-python:
    name: phase3 (python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provider_registry
          POSTGRES_PASSWORD: provider_registry
          POSTGRES_DB: provider_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provider_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://provider_registry:provider_registry@localhost:5432/provider_registry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Phase 3 packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "provider-registry-service[dev]" -e "provider-curation-agent[dev]" \
                      -e "provider-mcp-server[dev]" -e "provider-search-agent[dev]"
      - name: Check for repo-wide test-filename collisions (design.md §14, decisions.md P15)
        run: |
          dupes=$(find . -name "test_*.py" | xargs -n1 basename | sort | uniq -c | awk '$1>1')
          if [ -n "$dupes" ]; then echo "Duplicate test filenames found:"; echo "$dupes"; exit 1; fi
      - name: Run Phase 3 test suites (DB-backed tests run for real against the postgres service)
        run: |
          pytest provider-registry-service/src/provider_registry/tests \
                 provider-curation-agent/tests \
                 provider-mcp-server/tests \
                 provider-search-agent/tests \
                 data/scripts/provider_ingest -q

  # ── Phase 3 Terraform stubs ──────────────────────────────────────────────────
  # `terraform validate` only -- not `plan` or `apply`. Plan needs live GCP provider
  # credentials this project doesn't provision (verified, not assumed: the google provider
  # authenticates during plan even for pure resource creation). Validate needs no
  # credentials and no network access to GCP, so it's the real, zero-cost, executed check
  # that's actually achievable here -- named explicitly as such rather than overclaiming a
  # `plan` this job can't actually do for free.
  phase3-terraform:
    name: phase3 (terraform validate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - infra/terraform
          - provider-registry-service/infra
          - provider-mcp-server/infra
          - data/scripts/provider_ingest/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform validate (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: |
          terraform init -backend=false
          terraform validate
